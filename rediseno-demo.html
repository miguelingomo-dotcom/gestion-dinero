<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F4F7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B0B0E">
<meta name="robots" content="noindex">

  solo para identificar el servicio. Ibercaja, MyInvestor, Openbank y Pluxee no están en Simple Icons: inicial sobre su color.

<style>
/* ── TOKENS ── */
:root{
  --bg:#F4F4F7;--surface:#FFFFFF;--surface-2:#F0F0F4;--fill:rgba(118,118,128,.12);
  --text:#0B0B0F;--text-2:#62626E;--text-3:#8E8E99;--separator:rgba(60,60,67,.16);
  --accent:#5B4CEB;--accent-soft:rgba(91,76,235,.10);--on-accent:#FFFFFF;
  --positive:#0A8A4A;--positive-soft:rgba(10,138,74,.10);--negative:#D0342C;--negative-soft:rgba(208,52,44,.10);
  --warning:#B26B00;--warning-soft:rgba(255,170,0,.14);
  --chrome:rgba(244,244,247,.78);--scrim:rgba(10,10,15,.32);
  --shadow-1:0 1px 2px rgba(16,16,24,.05),0 2px 8px rgba(16,16,24,.04);
  --shadow-sheet:0 -8px 40px rgba(16,16,24,.18);
  --r-s:10px;--r-m:14px;--r-l:20px;--r-xl:28px;--r-pill:999px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;
  --ease-out:cubic-bezier(.23,1,.32,1);--ease-in-out:cubic-bezier(.77,0,.175,1);--ease-sheet:cubic-bezier(.32,.72,0,1);
  --d-press:120ms;--d-fast:180ms;--d-base:240ms;--d-sheet:420ms;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif;
  --font-round:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#0B0B0E;--surface:#17171C;--surface-2:#202027;--fill:rgba(118,118,128,.24);
  --text:#F4F4F6;--text-2:#A1A1AC;--text-3:#73737E;--separator:rgba(84,84,88,.42);
  --accent:#A197FF;--accent-soft:rgba(161,151,255,.14);--on-accent:#0B0B0E;
  --positive:#3DD68C;--positive-soft:rgba(61,214,140,.14);--negative:#FF7A70;--negative-soft:rgba(255,122,112,.14);
  --warning:#FFC247;--warning-soft:rgba(255,194,71,.14);
  --chrome:rgba(11,11,14,.74);--scrim:rgba(0,0,0,.5);
  --shadow-1:none;--shadow-sheet:0 -8px 40px rgba(0,0,0,.6);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0B0E;--surface:#17171C;--surface-2:#202027;--fill:rgba(118,118,128,.24);
  --text:#F4F4F6;--text-2:#A1A1AC;--text-3:#73737E;--separator:rgba(84,84,88,.42);
  --accent:#A197FF;--accent-soft:rgba(161,151,255,.14);--on-accent:#0B0B0E;
  --positive:#3DD68C;--positive-soft:rgba(61,214,140,.14);--negative:#FF7A70;--negative-soft:rgba(255,122,112,.14);
  --warning:#FFC247;--warning-soft:rgba(255,194,71,.14);
  --chrome:rgba(11,11,14,.74);--scrim:rgba(0,0,0,.5);
  --shadow-1:none;--shadow-sheet:0 -8px 40px rgba(0,0,0,.6);
}}

/* ── BASE ── */
*{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none;background:var(--bg);}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:17px;line-height:1.35;letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;min-height:100dvh;transition:background-color var(--d-base) ease,color var(--d-base) ease;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;}
input{font:inherit;font-size:17px;color:inherit;}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block;overflow:visible;}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}
.app{max-width:430px;margin:0 auto;min-height:100dvh;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));}
.pantalla{display:none;}
.pantalla.activa{display:block;animation:entra var(--d-base) var(--ease-out);}
@keyframes entra{from{opacity:0;transform:translateY(6px);}}

/* ── CABECERA ── */
.cabecera{position:sticky;top:0;z-index:20;padding:calc(env(safe-area-inset-top,0px) + 10px) var(--s5) 10px;
  display:flex;align-items:center;justify-content:space-between;background:var(--chrome);
  -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);}
.cabecera .titulo-p{font-size:17px;font-weight:600;opacity:0;transition:opacity var(--d-fast) ease;}
.cabecera.plegada .titulo-p{opacity:1;}
.cabecera.plegada{box-shadow:0 .5px 0 var(--separator);}
.acciones{display:flex;gap:var(--s2);}
.cab-nombre{font-size:17px;font-weight:600;min-width:84px;}
.cabecera .titulo-p{position:absolute;left:50%;transform:translateX(-50%);}
.btn-icono{width:36px;height:36px;border-radius:var(--r-pill);background:var(--fill);display:grid;place-items:center;color:var(--text);
  transition:transform var(--d-press) var(--ease-out);}
.btn-icono svg.i{width:19px;height:19px;}
.btn-icono:active{transform:scale(.92);}
.titulo-grande{font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.1;padding:var(--s1) var(--s5) var(--s3);}

/* ── PATRIMONIO ── */
.hero{padding:var(--s2) var(--s5) 0;}
.hero-lbl{font-size:15px;color:var(--text-2);font-weight:500;display:flex;align-items:center;gap:6px;}
.hero-cifra{font-family:var(--font-round);font-size:48px;font-weight:700;letter-spacing:-.035em;line-height:1.05;margin-top:6px;
  font-variant-numeric:tabular-nums;white-space:nowrap;}
.hero-cifra .dec{font-size:28px;letter-spacing:-.02em;color:var(--text-2);font-weight:600;}
.privado .hero-cifra,.privado .monto-oculto{filter:blur(9px);}
.cambio{display:inline-flex;align-items:center;gap:4px;margin-top:var(--s2);font-size:15px;font-weight:600;color:var(--positive);}
.cambio .peri{color:var(--text-2);font-weight:500;}
.grafica{position:relative;height:150px;margin:var(--s4) 0 var(--s2);touch-action:pan-y;}
.grafica svg{width:100%;height:100%;display:block;overflow:visible;}
.grafica .linea{fill:none;stroke:var(--accent);stroke-width:2.25;stroke-linejoin:round;stroke-linecap:round;}
.grafica .area{fill:url(#relleno);}
.grafica .cursor{stroke:var(--text-3);stroke-width:1;stroke-dasharray:3 3;opacity:0;}
.grafica .punto{fill:var(--accent);stroke:var(--surface);stroke-width:3;opacity:0;}
.grafica.scrub .cursor,.grafica.scrub .punto{opacity:1;}
.periodos{display:flex;gap:2px;padding:3px;background:var(--fill);border-radius:var(--r-pill);margin:0 var(--s5);position:relative;}
.periodos .marca{position:absolute;top:3px;bottom:3px;border-radius:var(--r-pill);background:var(--surface);box-shadow:var(--shadow-1);
  transition:transform var(--d-base) var(--ease-out),width var(--d-base) var(--ease-out);}
:root[data-theme="dark"] .periodos .marca{background:var(--surface-2);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .periodos .marca{background:var(--surface-2);}}
.periodos button{flex:1;position:relative;z-index:1;padding:7px 0;font-size:14px;font-weight:600;color:var(--text-2);border-radius:var(--r-pill);
  transition:color var(--d-fast) ease;}
.periodos button.on{color:var(--text);}

/* ── TARJETAS Y FILAS ── */
.seccion{margin-top:var(--s6);}
.seccion-cab{display:flex;align-items:baseline;justify-content:space-between;padding:0 var(--s5) var(--s2);}
.seccion-cab h2{font-size:20px;font-weight:700;letter-spacing:-.02em;}
.seccion-cab button{font-size:15px;color:var(--accent);font-weight:500;}
.grupo{margin:0 var(--s4);background:var(--surface);border-radius:var(--r-l);box-shadow:var(--shadow-1);overflow:hidden;}
.resumen{display:grid;grid-template-columns:repeat(3,1fr);margin:var(--s5) var(--s4) 0;background:var(--surface);border-radius:var(--r-l);
  box-shadow:var(--shadow-1);padding:var(--s3) 0;}
.resumen div{padding:0 var(--s3);border-left:.5px solid var(--separator);}
.resumen div:first-child{border-left:0;}
.resumen small{display:block;font-size:13px;color:var(--text-2);font-weight:500;}
.resumen b{display:block;white-space:nowrap;font-size:16px;font-weight:600;margin-top:2px;letter-spacing:-.01em;}
.aviso{margin:var(--s4) var(--s4) 0;width:calc(100% - 2 * var(--s4));text-align:left;display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);border-radius:var(--r-l);
  background:var(--warning-soft);color:var(--text);transition:transform var(--d-press) var(--ease-out);}
.aviso:active{transform:scale(.98);}
.aviso .ico{width:32px;height:32px;border-radius:var(--r-pill);display:grid;place-items:center;background:var(--warning);color:#fff;flex:none;}
.aviso .ico svg.i{width:17px;height:17px;}
.aviso p{font-size:15px;line-height:1.3;flex:1;}
.aviso p small{display:block;color:var(--text-2);font-size:13px;}
.fila{display:flex;align-items:center;gap:var(--s3);padding:10px var(--s4);min-height:64px;width:100%;text-align:left;position:relative;
  transition:background-color var(--d-press) ease;}
.fila+.fila::before{content:"";position:absolute;top:0;left:68px;right:0;border-top:.5px solid var(--separator);}
.fila:active{background:var(--fill);}
.fila .txt{flex:1;min-width:0;}
.fila .t1,.fila .t2{display:block;}
.fila .t1{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em;}
.fila .t2{font-size:13px;color:var(--text-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fila .monto{font-size:16px;font-weight:600;flex:none;letter-spacing:-.01em;}
.fila .monto.gasto{color:var(--negative);}
.fila .monto.ing{color:var(--positive);}
.fila .monto.tr{color:var(--accent);}
.ficha{width:40px;height:40px;border-radius:var(--r-m);display:grid;place-items:center;flex:none;background:var(--fill);color:var(--text);
  overflow:hidden;}
.ficha svg.i{width:21px;height:21px;}
.ficha.marca svg{width:22px;height:22px;fill:currentColor;}
.ficha.marca,.ficha.letra,.ficha.logo{box-shadow:inset 0 0 0 .5px var(--separator);}
.ficha.logo{position:relative;}
.ficha.logo img{width:100%;height:100%;object-fit:cover;display:block;}
.ficha.letra{font-family:var(--font-round);font-weight:700;font-size:18px;color:#fff;}
.ficha.cat{background:var(--cat-bg);color:var(--cat);}

/* ── CUENTAS (carrusel) ── */
.cuentas{display:flex;gap:var(--s3);overflow-x:auto;padding:0 var(--s4) var(--s1);scroll-snap-type:x mandatory;scroll-padding:0 var(--s4);
  overscroll-behavior-x:contain;scrollbar-width:none;}
.cuentas::-webkit-scrollbar{display:none;}
.cuenta{flex:0 0 156px;scroll-snap-align:start;background:var(--surface);border-radius:var(--r-l);padding:var(--s4);box-shadow:var(--shadow-1);
  text-align:left;transition:transform var(--d-press) var(--ease-out);}
.cuenta:active{transform:scale(.97);}
.cuenta .ficha{width:34px;height:34px;border-radius:var(--r-s);}
.cuenta .ficha.letra{font-size:16px;}
.cuenta .n{font-size:14px;color:var(--text-2);margin-top:var(--s5);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cuenta .b{font-size:18px;font-weight:600;margin-top:2px;letter-spacing:-.015em;}

/* ── CATEGORÍAS ── */
.barra{height:4px;border-radius:2px;background:var(--fill);margin-top:7px;overflow:hidden;}
.barra i{display:block;height:100%;border-radius:2px;background:var(--cat);transform-origin:left;transform:scaleX(0);
  transition:transform 700ms var(--ease-out);}

/* ── MOVIMIENTOS ── */
.buscador{margin:0 var(--s4);display:flex;align-items:center;gap:var(--s2);background:var(--fill);border-radius:var(--r-m);padding:0 var(--s3);height:40px;color:var(--text-2);}
.buscador svg.i{width:18px;height:18px;}
.buscador input{flex:1;border:0;background:none;outline:none;height:100%;font-size:17px;color:var(--text);}
.buscador input::placeholder{color:var(--text-3);}
.chips{display:flex;gap:var(--s2);overflow-x:auto;padding:var(--s3) var(--s4) var(--s1);scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex:none;padding:7px 14px;border-radius:var(--r-pill);background:var(--fill);font-size:15px;font-weight:500;color:var(--text);
  transition:background-color var(--d-fast) ease,color var(--d-fast) ease,transform var(--d-press) var(--ease-out);}
.chip:active{transform:scale(.95);}
.chip.on{background:var(--text);color:var(--bg);}
.dia{display:flex;justify-content:space-between;align-items:baseline;padding:var(--s5) var(--s5) var(--s2);font-size:13px;font-weight:600;
  color:var(--text-2);text-transform:uppercase;letter-spacing:.04em;}
.dia .neto{text-transform:none;letter-spacing:0;font-weight:500;}
.vacio{text-align:center;padding:56px var(--s8);color:var(--text-2);}
.vacio .ficha{margin:0 auto var(--s3);width:52px;height:52px;border-radius:var(--r-l);}
.vacio b{display:block;color:var(--text);font-size:17px;font-weight:600;margin-bottom:4px;}
.vacio p{font-size:15px;}
.esqueleto{display:flex;align-items:center;gap:var(--s3);padding:10px var(--s4);min-height:64px;}
.esqueleto i{display:block;border-radius:8px;background:var(--fill);position:relative;overflow:hidden;}
.esqueleto i::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:brillo 1.2s ease-in-out infinite;}
:root[data-theme="dark"] .esqueleto i::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);}
@keyframes brillo{to{transform:translateX(100%);}}

/* ── BARRA DE PESTAÑAS ── */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--chrome);-webkit-backdrop-filter:blur(20px) saturate(180%);
  backdrop-filter:blur(20px) saturate(180%);box-shadow:0 -.5px 0 var(--separator);padding-bottom:env(safe-area-inset-bottom,0px);}
.tabbar nav{max-width:430px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;height:58px;}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:500;color:var(--text-3);padding-top:6px;
  transition:color var(--d-fast) ease;}
.tab svg.i{width:24px;height:24px;stroke-width:1.9;transition:transform var(--d-press) var(--ease-out);}
.tab:active svg.i{transform:scale(.88);}
.tab.on{color:var(--accent);}
.tab-mas{justify-self:center;width:48px;height:48px;border-radius:var(--r-m);background:var(--accent);color:var(--on-accent);display:grid;
  place-items:center;box-shadow:0 6px 18px rgba(91,76,235,.35);transition:transform var(--d-press) var(--ease-out);}
.tab-mas:active{transform:scale(.92);}
.tab-mas svg.i{width:26px;height:26px;stroke-width:2.2;}

/* ── HOJA ── */
.velo{position:fixed;inset:0;z-index:40;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity var(--d-sheet) var(--ease-sheet);}
.velo.on{opacity:1;pointer-events:auto;}
.hoja{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:430px;margin:0 auto;background:var(--surface);border-radius:var(--r-xl) var(--r-xl) 0 0;
  box-shadow:var(--shadow-sheet);padding:8px var(--s5) calc(var(--s6) + env(safe-area-inset-bottom,0px));transform:translateY(110%);
  transition:transform var(--d-sheet) var(--ease-sheet),visibility 0s linear var(--d-sheet);touch-action:none;visibility:hidden;}
.hoja.on{transform:translateY(0);visibility:visible;transition:transform var(--d-sheet) var(--ease-sheet);}
.hoja .asa{width:36px;height:5px;border-radius:3px;background:var(--fill);margin:0 auto var(--s4);}
.hoja .cabeza{display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--s2);padding-bottom:var(--s5);}
.hoja .cabeza .ficha{width:60px;height:60px;border-radius:var(--r-l);}
.hoja .cabeza .ficha svg.i{width:30px;height:30px;}
.hoja .cabeza .ficha.marca svg{width:32px;height:32px;}
.hoja .cabeza .ficha.letra{font-size:26px;}
.hoja .cabeza .nombre{font-size:17px;font-weight:600;}
.hoja .cabeza .cifra{font-family:var(--font-round);font-size:36px;font-weight:700;letter-spacing:-.03em;}
.hoja .detalle{background:var(--surface-2);border-radius:var(--r-m);}
.hoja .detalle div{display:flex;justify-content:space-between;padding:12px var(--s4);font-size:15px;}
.hoja .detalle div+div{box-shadow:inset 0 .5px 0 var(--separator);}
.hoja .detalle span{color:var(--text-2);}
.hoja .botones{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-top:var(--s4);}
.boton{height:50px;border-radius:var(--r-m);font-size:17px;font-weight:600;background:var(--fill);transition:transform var(--d-press) var(--ease-out),opacity var(--d-press);}
.boton:active{transform:scale(.97);}
.boton.primario{background:var(--accent);color:var(--on-accent);}
.boton.peligro{color:var(--negative);}

.nota{margin:var(--s6) var(--s5) 0;font-size:13px;color:var(--text-3);text-align:center;line-height:1.4;}

@media (hover:hover) and (pointer:fine){
  .fila:hover{background:var(--fill);}
  .chip:hover:not(.on){background:var(--separator);}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;transition-duration:1ms!important;}
  .hoja{transition:opacity 200ms ease!important;}
}
@media (prefers-reduced-transparency:reduce){.cabecera,.tabbar{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none;}}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- ── INICIO ── -->
  <section class="pantalla activa" id="p-inicio" aria-label="Inicio">
    <header class="cabecera" data-titulo>
      <span class="cab-nombre">Inicio</span>
      <span class="titulo-p num monto-oculto" id="titCorto"></span>
      <div class="acciones">
        <button class="btn-icono ojo" aria-label="Ocultar saldos" data-ico="eye"></button>
        <button class="btn-icono tema-btn" aria-label="Cambiar tema" data-ico="moon"></button>
      </div>
    </header>
    <div class="hero">
      <div class="hero-lbl">Patrimonio total</div>
      <div class="hero-cifra num" id="total" aria-live="polite"><span class="ent">0</span><span class="dec">,00 €</span></div>
      <div class="cambio num" id="cambio"><span data-ico="trending-up" class="mini"></span><span id="cambioTxt">+312,40 € (5,6 %)</span><span class="peri" id="cambioPeri">· 1 mes</span></div>
    </div>
    <div class="grafica" id="grafica">
      <svg viewBox="0 0 390 150" preserveAspectRatio="none" aria-hidden="true">
        <defs><linearGradient id="relleno" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".18"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
        <path class="area" id="area"/><path class="linea" id="linea"/>
        <line class="cursor" id="cursor" y1="0" y2="150"/><circle class="punto" id="punto" r="5"/>
      </svg>
    </div>

/* ¿a es la marca b con una errata? Letra cambiada o dos intercambiadas siempre; letra de más o de menos solo en marcas
   de 7 letras o más (si no, «consumo» sería Consum) */
function unaErrata(a,b){
  if(a===b)return true;if(Math.abs(a.length-b.length)>1)return false;
  if(a.length!==b.length&&b.length<7)return false;
  let i=0;while(i<a.length&&a[i]===b[i])i++;
  if(a.length===b.length)return a.slice(i+1)===b.slice(i+1)||(a[i]===b[i+1]&&a[i+1]===b[i]&&a.slice(i+2)===b.slice(i+2));
  return a.length>b.length?a.slice(i+1)===b.slice(i):a.slice(i)===b.slice(i+1);
}
/* El comercio que aparece antes en el nombre («mercadona nike» → Mercadona). Palabras enteras: «desayunike» no es Nike */
function comercioDe(nombre){
  const t=' '+normal(nombre)+' ',palabras=normal(nombre).split(' ');
  let mejor=null,pos=1e9;
  for(const [clave,variantes] of COMERCIOS)for(const v of variantes){
    const i=t.indexOf(' '+v+' ');
    if(i>=0&&i<pos){mejor=clave;pos=i;}
  }
  if(mejor)return mejor;
  for(const [clave,variantes] of COMERCIOS)for(const v of variantes)
    if(!v.includes(' ')&&v.length>=6&&palabras.some(p=>p.length>=6&&unaErrata(p,v)))return clave;
  return null;
}
const marcaDe=comercioDe;
/* El nombre en Notion lleva a veces un emoji delante («🎵 Spotify»): se quita solo al mostrarlo */
const sinEmoji=s=>s.replace(/^[\p{Extended_Pictographic}\u{FE0F}\u{200D}\s]+/u,'').trim();

const SERIES={};
(function(){
  let s=97;const r=()=>(s=(s*9301+49297)%233280)/233280;
  for(const [p,n,base] of [['1M',31,6668],['3M',92,6120],['6M',183,5480],['Todo',365,3900]]){
    const v=[];let x=base;
    for(let i=0;i<n;i++){x+=(TOTAL-x)/(n-i)*.9+(r()-.47)*(base*.012);v.push(x);}
    v[n-1]=TOTAL;SERIES[p]=v;
  }
})();
const W=390,H=150,PAD=10;
let serie=SERIES['1M'],puntos=[];
function aPuntos(v){
  const min=Math.min(...v),max=Math.max(...v);
  return v.map((y,i)=>[i/(v.length-1)*W,PAD+(1-(y-min)/(max-min||1))*(H-2*PAD)]);
}
function remuestrear(p,n){return Array.from({length:n},(_,j)=>{const x=j/(n-1)*(p.length-1),i=Math.floor(x),f=x-i,a=p[i],b=p[Math.min(i+1,p.length-1)];return[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f];});}
const camino=p=>p.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+','+q[1].toFixed(1)).join('');
function dibujar(p){
  document.getElementById('linea').setAttribute('d',camino(p));

}

  serie=nueva;puntos=aPuntos(nueva);
  if(reducido()){dibujar(hasta);return;}
  const t0=performance.now();

    dibujar(desde.map((a,i)=>[a[0]+(hasta[i][0]-a[0])*e,a[1]+(hasta[i][1]-a[1])*e]));if(p<1)requestAnimationFrame(paso);})(t0);

const oscuroAhora=()=>document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
function pintarTemaBtn(){document.querySelectorAll('.tema-btn').forEach(b=>{b.innerHTML=svgIcono(oscuroAhora()?'sun':'moon');b.setAttribute('aria-label',oscuroAhora()?'Tema claro':'Tema oscuro');});}
document.querySelectorAll('.tema-btn').forEach(b=>b.addEventListener('click',()=>{document.documentElement.dataset.theme=oscuroAhora()?'light':'dark';pintarTemaBtn();}));
pintarTemaBtn();
document.querySelectorAll('.ojo').forEach(b=>b.addEventListener('click',()=>{
  const on=document.getElementById('app').classList.toggle('privado');
  document.querySelectorAll('.ojo').forEach(o=>{o.innerHTML=svgIcono(on?'eye-off':'eye');o.setAttribute('aria-label',on?'Mostrar saldos':'Ocultar saldos');});
}));
